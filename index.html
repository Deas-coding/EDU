<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Class Archive — Memories</title>

<meta name="description"
content="Digital archive berisi foto, video, cerita, anggota kelas, dan kenangan selama masa sekolah.">

<style>

/* =========================================================
   FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');


/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#f5f3ee;
  --paper:#fffdf8;
  --text:#171717;
  --muted:#77736c;
  --line:#ddd8cf;
  --accent:#7b8f68;
  --accent-light:#dce4d5;
  --accent2:#d9b88f;
  --dark:#1e211d;
  --white:#ffffff;

  --shadow:
    0 18px 45px rgba(31,31,26,.10);

  --shadow-heavy:
    0 25px 70px rgba(31,31,26,.18);
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
textarea{
  font:inherit;
}


/* =========================================================
   GRAIN
========================================================= */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  opacity:.035;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"
  );
}


/* =========================================================
   SCROLL REVEAL
========================================================= */

.reveal{
  opacity:0;
  transform:translateY(35px);
  transition:
    opacity .8s ease,
    transform .8s ease;
}

.reveal.visible{
  opacity:1;
  transform:translateY(0);
}


/* =========================================================
   NAV
========================================================= */

nav{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(1150px,calc(100% - 32px));
  z-index:500;

  padding:12px 16px 12px 20px;

  border:1px solid rgba(255,255,255,.7);

  background:
    rgba(255,253,248,.78);

  backdrop-filter:
    blur(18px);

  border-radius:100px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  box-shadow:
    0 8px 30px rgba(0,0,0,.06);
}

.brand{
  font-weight:700;
  letter-spacing:-.03em;

  display:flex;
  align-items:center;
  gap:9px;
}

.brand-dot{
  width:10px;
  height:10px;
  background:var(--accent);
  border-radius:50%;
}

.navlinks{
  display:flex;
  gap:24px;
  font-size:13px;
  color:#5e5a53;
}

.navlinks a{
  transition:.25s;
}

.navlinks a:hover{
  color:var(--accent);
}

.nav-btn{
  border:0;
  background:var(--dark);
  color:white;

  padding:10px 16px;

  border-radius:50px;

  cursor:pointer;
  font-size:12px;

  transition:.3s;
}

.nav-btn:hover{
  transform:translateY(-2px);
  background:var(--accent);
}


/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:92vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    140px
    22px
    80px;

  position:relative;
}

.hero-inner{
  width:min(1150px,100%);

  display:grid;

  grid-template-columns:
    1.15fr
    .85fr;

  gap:55px;

  align-items:center;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  color:var(--muted);
  margin-bottom:20px;
}

h1{
  font-size:
    clamp(54px,8vw,105px);

  line-height:.88;
  letter-spacing:-.065em;

  max-width:780px;
  font-weight:600;
}

h1 em{
  font-family:'Playfair Display',serif;
  font-weight:500;
}

.hero-copy{
  max-width:540px;

  color:var(--muted);
  line-height:1.75;

  margin-top:26px;

  font-size:15px;
}

.hero-meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:28px;
}

.pill{
  border:1px solid var(--line);

  border-radius:100px;

  padding:
    9px
    14px;

  font-size:12px;

  background:
    rgba(255,255,255,.45);
}

.hero-photo{
  position:relative;

  height:510px;

  transform:rotate(3deg);

  background:#e7e0d4;

  padding:14px;

  box-shadow:var(--shadow);

  transition:.5s;
}

.hero-photo:hover{
  transform:
    rotate(0deg)
    scale(1.015);

  box-shadow:var(--shadow-heavy);
}

.hero-photo img{
  width:100%;
  height:100%;

  object-fit:cover;
  display:block;

  filter:saturate(.85);
}

.tape{
  position:absolute;

  width:105px;
  height:27px;

  background:
    rgba(219,190,148,.62);

  top:-13px;
  left:50%;

  transform:
    translateX(-50%)
    rotate(-4deg);

  z-index:2;
}

.hero-label{
  position:absolute;

  bottom:25px;
  left:-30px;

  background:var(--paper);

  padding:
    16px
    20px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.12);

  transform:rotate(-5deg);

  font-family:
    'Playfair Display',
    serif;

  font-size:18px;
}

/* =========================================================
   HERO LIVE CLOCK
========================================================= */
.hero-clock{position:absolute;top:108px;right:max(24px,calc((100% - 1150px)/2));width:178px;min-height:112px;padding:16px 17px 14px;border:1px solid rgba(123,143,104,.28);border-radius:22px;background:rgba(255,253,248,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(31,31,26,.10);overflow:hidden;z-index:20;animation:clockFloat 4s ease-in-out infinite}
.hero-clock:before{content:"";position:absolute;width:90px;height:90px;right:-42px;top:-45px;border:1px solid rgba(123,143,104,.25);border-radius:50%;animation:clockOrbit 7s linear infinite}
.hero-clock-orbit{position:absolute;width:8px;height:8px;right:24px;top:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(123,143,104,.10);animation:clockPulse 1.5s ease-in-out infinite}
.hero-clock-top{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:8px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:9px}
.hero-clock-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:clockPulse 1.5s ease-in-out infinite}
.hero-clock-time{font-variant-numeric:tabular-nums;font-size:27px;line-height:1;letter-spacing:-.055em;font-weight:700}
.hero-clock-date{margin-top:8px;color:var(--muted);font-size:9px;line-height:1.4;white-space:nowrap}
.hero-clock-line{display:flex;align-items:center;gap:5px;margin-top:12px}.hero-clock-line span{height:1px;flex:1;background:var(--line)}.hero-clock-line i{width:4px;height:4px;border-radius:50%;background:var(--accent2);animation:clockPulse 1s ease-in-out infinite}
@keyframes clockFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(.5deg)}}
@keyframes clockPulse{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1.35);opacity:1}}
@keyframes clockOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media(max-width:850px){.hero-clock{top:102px;right:18px;width:160px;min-height:104px}.hero-clock-time{font-size:23px}}
@media(max-width:760px){.hero-clock{top:92px;right:16px;width:145px;min-height:92px;padding:12px 13px 11px;border-radius:18px}.hero-clock-top{font-size:7px;margin-bottom:7px}.hero-clock-time{font-size:20px}.hero-clock-date{font-size:8px;white-space:normal;max-width:115px}.hero-clock-line{margin-top:8px}}
@media(prefers-reduced-motion:reduce){.hero-clock,.hero-clock-orbit,.hero-clock-dot,.hero-clock-line i,.hero-clock:before{animation:none}}

.scroll-note{
  position:absolute;

  bottom:30px;
  left:50%;

  transform:translateX(-50%);

  font-size:11px;
  color:var(--muted);

  animation:
    floatDown 2s ease-in-out infinite;
}

@keyframes floatDown{
  0%,100%{
    transform:
      translate(-50%,0);
  }

  50%{
    transform:
      translate(-50%,7px);
  }
}


/* =========================================================
   SECTIONS
========================================================= */

section{
  width:
    min(
      1150px,
      calc(100% - 36px)
    );

  margin:0 auto;

  padding:95px 0;
}

.section-head{
  display:flex;

  justify-content:space-between;
  align-items:end;

  gap:30px;

  margin-bottom:35px;
}

.section-kicker{
  font-size:11px;

  text-transform:uppercase;
  letter-spacing:.17em;

  color:var(--muted);

  margin-bottom:10px;
}

h2{
  font-size:
    clamp(34px,5vw,58px);

  letter-spacing:-.055em;
  line-height:.95;
}

h2 em{
  font-family:
    'Playfair Display',
    serif;

  font-weight:500;
}

.section-desc{
  max-width:370px;

  color:var(--muted);

  font-size:13px;
  line-height:1.7;
}


/* =========================================================
   GALLERY FILTER
========================================================= */

.timeline{
  display:flex;

  gap:10px;

  margin-bottom:34px;

  overflow:auto;

  padding-bottom:5px;
}

.filter{
  border:1px solid var(--line);

  background:transparent;

  border-radius:100px;

  padding:
    10px
    17px;

  cursor:pointer;

  color:var(--muted);

  white-space:nowrap;

  font-size:12px;

  transition:.25s;
}

.filter.active,
.filter:hover{
  background:var(--dark);
  color:white;
  border-color:var(--dark);
}


/* =========================================================
   GALLERY
========================================================= */

.gallery{
  columns:
    3
    250px;

  column-gap:18px;
}

.card{
  break-inside:avoid;

  margin-bottom:18px;

  position:relative;

  cursor:pointer;

  background:var(--paper);

  padding:10px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.06);

  transition:.35s ease;

  display:inline-block;

  width:100%;
}

.card:hover{
  transform:
    translateY(-6px)
    rotate(-.5deg);

  box-shadow:var(--shadow);
}

.card img{
  width:100%;

  display:block;

  object-fit:cover;

  max-height:530px;
}

.card-info{
  padding:
    13px
    5px
    4px;

  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:start;
}

.card-title{
  font-weight:600;
  font-size:13px;
}

.card-date{
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
}

.card-caption{
  font-size:11px;

  color:var(--muted);

  line-height:1.5;

  margin-top:5px;
}


/* =========================================================
   ADD PHOTO CARD
========================================================= */

.add-photo-card{
  break-inside:avoid;

  margin-bottom:18px;

  background:
    linear-gradient(
      135deg,
      var(--accent-light),
      var(--paper)
    );

  border:
    1px dashed
    var(--accent);

  min-height:230px;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  cursor:pointer;

  transition:.35s;
}

.add-photo-card:hover{
  transform:
    translateY(-6px);

  box-shadow:var(--shadow);
}

.plus-circle{
  width:65px;
  height:65px;

  border-radius:50%;

  background:var(--dark);
  color:white;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:30px;

  margin:
    auto
    auto
    14px;

  transition:.3s;
}

.add-photo-card:hover
.plus-circle{
  background:var(--accent);

  transform:
    rotate(90deg)
    scale(1.08);
}

.add-photo-text strong{
  display:block;

  font-size:14px;

  margin-bottom:5px;
}

.add-photo-text span{
  font-size:11px;
  color:var(--muted);
}


/* =========================================================
   LIVE TIME
========================================================= */

.time-section{
  background:
    linear-gradient(
      135deg,
      #1e211d,
      #30382c
    );

  color:white;

  width:100%;
  max-width:none;

  margin:0;

  padding:
    90px
    max(18px,calc((100% - 1150px)/2));
}

.time-container{
  max-width:1150px;

  margin:auto;

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:60px;

  align-items:center;
}

.time-label{
  text-transform:uppercase;

  font-size:10px;

  letter-spacing:.2em;

  color:#b9c5b1;

  margin-bottom:15px;
}

.live-time{
  font-size:
    clamp(45px,7vw,90px);

  line-height:.9;

  letter-spacing:-.06em;

  font-weight:600;
}

.live-date{
  margin-top:18px;

  color:#c8cec3;

  font-size:13px;
}

.time-card{
  border:
    1px solid
    rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.05);

  backdrop-filter:
    blur(15px);

  padding:35px;

  border-radius:8px;
}

.time-card-title{
  font-family:
    'Playfair Display',
    serif;

  font-size:25px;

  margin-bottom:12px;
}

.time-card p{
  color:#bfc5ba;

  line-height:1.7;

  font-size:13px;
}


/* =========================================================
   VIDEO MEMORY
========================================================= */

.video-section{
  padding-top:110px;
}

.video-wrapper{
  position:relative;

  background:#111;

  padding:12px;

  box-shadow:var(--shadow-heavy);
}

.video-wrapper video{
  width:100%;

  display:block;

  max-height:650px;

  background:#111;
}

.video-caption{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  padding:18px 5px 3px;
}

.video-caption strong{
  font-size:14px;
}

.video-caption span{
  font-size:11px;
  color:var(--muted);
}


/* =========================================================
   CLASS MEMBERS
========================================================= */

.member-grid{
  display:grid;

  grid-template-columns:
    repeat(
      4,
      1fr
    );

  gap:16px;
}

.member{
  background:var(--paper);

  border:
    1px solid
    var(--line);

  padding:10px;

  transition:.35s;

  position:relative;

  overflow:hidden;
}

.member:hover{
  transform:
    translateY(-7px)
    rotate(-1deg);

  box-shadow:var(--shadow);
}

.member-photo{
  aspect-ratio:1/1;

  overflow:hidden;

  background:#e8e4dc;
}

.member-photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  transition:.5s;
}

.member:hover
.member-photo img{
  transform:scale(1.07);
}

.member-info{
  padding:
    15px
    7px
    8px;
}

.member-name{
  font-weight:600;
  font-size:14px;
}

.member-role{
  margin-top:4px;

  color:var(--muted);

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:.1em;
}


/* =========================================================
   INSTAGRAM
========================================================= */

.instagram-section{
  display:grid;

  grid-template-columns:
    .8fr
    1.2fr;

  gap:25px;

  align-items:stretch;
}

.instagram-card{
  background:
    linear-gradient(
      135deg,
      #f2eadf,
      #dce4d5
    );

  padding:45px;

  min-height:300px;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  position:relative;

  overflow:hidden;
}

.instagram-card:after{
  content:"◎";

  position:absolute;

  right:-30px;
  top:-60px;

  font-size:240px;

  opacity:.08;
}

.instagram-kicker{
  font-size:10px;

  letter-spacing:.2em;

  text-transform:uppercase;

  color:var(--muted);
}

.instagram-title{
  font-family:
    'Playfair Display',
    serif;

  font-size:
    clamp(35px,5vw,60px);

  margin-top:15px;

  position:relative;

  z-index:2;
}

.instagram-handle{
  font-size:15px;

  margin-top:10px;

  color:#5d6953;
}

.instagram-btn{
  display:inline-flex;

  width:max-content;

  align-items:center;

  gap:10px;

  background:var(--dark);

  color:white;

  padding:
    12px
    18px;

  border-radius:100px;

  font-size:12px;

  transition:.3s;
}

.instagram-btn:hover{
  background:var(--accent);

  transform:
    translateY(-2px);
}

.insta-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.insta-grid img{
  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  display:block;

  transition:.3s;
}

.insta-grid img:hover{
  transform:scale(.96);
}


/* =========================================================
   CONFESSION
========================================================= */

.confess-box{
  background:var(--paper);

  border:
    1px solid
    var(--line);

  padding:50px;

  box-shadow:var(--shadow);

  display:grid;

  grid-template-columns:
    .8fr
    1.2fr;

  gap:60px;
}

.confess-title{
  font-family:
    'Playfair Display',
    serif;

  font-size:
    clamp(35px,5vw,60px);

  line-height:1;
}

.confess-desc{
  color:var(--muted);

  font-size:13px;

  line-height:1.7;

  margin-top:20px;
}

.confess-form{
  display:flex;

  flex-direction:column;

  gap:13px;
}

.confess-form input,
.confess-form textarea{
  width:100%;

  border:
    1px solid
    var(--line);

  background:#faf8f2;

  padding:
    14px
    16px;

  outline:none;

  border-radius:3px;

  color:var(--text);

  resize:vertical;
}

.confess-form input:focus,
.confess-form textarea:focus{
  border-color:var(--accent);
}

.confess-form textarea{
  min-height:130px;
}

.confess-btn{
  border:0;

  background:var(--dark);

  color:white;

  padding:
    14px
    20px;

  cursor:pointer;

  border-radius:100px;

  transition:.3s;
}

.confess-btn:hover{
  background:var(--accent);

  transform:
    translateY(-2px);
}

.confess-note{
  font-size:10px;

  color:var(--muted);

  line-height:1.5;
}


/* =========================================================
   TIMELINE
========================================================= */

.year-grid{
  display:grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap:15px;
}

.year{
  min-height:210px;

  padding:25px;

  background:var(--paper);

  border:
    1px solid
    var(--line);

  position:relative;

  overflow:hidden;

  transition:.3s;
}

.year:hover{
  transform:
    translateY(-4px);

  box-shadow:var(--shadow);
}

.year-number{
  font-size:70px;

  letter-spacing:-.08em;

  font-weight:700;

  line-height:.9;
}

.year-name{
  position:absolute;

  bottom:24px;
  left:25px;

  font-family:
    'Playfair Display',
    serif;

  font-size:23px;
}

.year-count{
  position:absolute;

  right:24px;
  bottom:26px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   ABOUT
========================================================= */

.about-box{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:50px;

  align-items:center;
}

.about-big{
  font-family:
    'Playfair Display',
    serif;

  font-size:
    clamp(35px,5vw,65px);

  line-height:1.05;
}

.about-text{
  color:var(--muted);

  font-size:14px;

  line-height:1.9;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  padding:
    50px
    20px
    100px;

  text-align:center;

  color:var(--muted);

  font-size:11px;
}

footer strong{
  color:var(--text);
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(20,20,18,.82);

  z-index:1000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:25px;

  backdrop-filter:
    blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  max-width:900px;

  width:100%;

  position:relative;
}

.modal img{
  width:100%;

  max-height:78vh;

  object-fit:contain;

  display:block;
}

.modal-caption{
  color:white;

  margin-top:12px;

  font-size:12px;
}

.close{
